[package]
name = "zed-ftp-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MCP server backing the zed-ftp Zed extension"

[[bin]]
name = "zed-ftp-mcp"
path = "src/main.rs"

[dependencies]
# MCP runtime — `server` and `macros` are default; need `transport-io` for stdio.
rmcp = { version = "1.6", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# FTP — sync API, called via spawn_blocking from async tools
suppaftp = { version = "8", default-features = false, features = ["native-tls"] }

# Async / runtime
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "fs",
] }

# Config + secrets
toml = "0.8"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
dirs = "5"

# File walking with .gitignore semantics
ignore = "0.4"

# CLI + errors + logging
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Used for password prompts on `set-password`
rpassword = "7"
